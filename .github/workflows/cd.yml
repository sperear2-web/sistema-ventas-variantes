name: CD

# El despliegue sólo se ejecuta cuando el flujo CI terminó con éxito sobre la rama main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Desplegar en Render
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: pruebas
    steps:
      - name: Desplegar variante Básica
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BASICA }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::Falta el secreto RENDER_DEPLOY_HOOK_BASICA"; exit 0; fi
          curl -fsS -X POST "$HOOK"

      - name: Verificar despliegue (health check)
        env:
          URL_BASICA: ${{ vars.URL_BASICA }}
        run: |
          for u in "$URL_BASICA"; do
            [ -z "$u" ] && continue
            for i in 1 2 3 4 5 6; do
              curl -fsS "$u/health" && break || sleep 20
            done
          done
